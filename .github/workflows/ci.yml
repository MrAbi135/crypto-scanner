name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a pull request run costs nothing: the newer push is the only
  # revision anyone will merge. Superseding a main run can abort the docker job
  # mid-push, leaving a half-written image in GHCR for a commit that is already
  # part of history. Two merges landed 32s apart on 2026-08-16 and did exactly
  # that. On main, queue behind the running job instead of killing it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration" --cov=scanner
      - name: shared 100% coverage (scoped)
        run: uv run pytest tests/unit/shared -o addopts="" --cov=scanner.shared --cov-report=term-missing --cov-fail-under=100
      - name: no-float guard
        run: bash ../scripts/check-no-float.sh

  # Runs the testcontainers suite against real PostgreSQL + TimescaleDB.
  # This job is what makes the [tool.coverage.run] omit list honest: the
  # persistence adapters excluded from the unit floor are proven here, so the
  # exclusion moves the proof rather than deleting it. Keep this job green
  # before adding anything to that list.
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: integration suite (testcontainers)
        run: uv run pytest tests/integration -m integration --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v3
      - name: pip-audit (backend deps)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt
      - name: pnpm audit (frontend deps)
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/backend.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mrabi135/crypto-scanner/backend:${{ github.sha }}
            ghcr.io/mrabi135/crypto-scanner/backend:main
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/frontend.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mrabi135/crypto-scanner/frontend:${{ github.sha }}
            ghcr.io/mrabi135/crypto-scanner/frontend:main

  # SLS §14's alert rules, checked and unit-tested. `check rules` only says the
  # PromQL parses; `test rules` says each one fires on the shape it is meant to
  # catch and stays quiet otherwise. An alert that cannot fire looks healthier
  # than no alert at all, which is what makes it worth a CI job.
  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check and test alert rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/p" -w /p/tests \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules ../alerts/detection-targets.yml ../alerts/process-liveness.yml
          docker run --rm -v "$PWD/ops/prometheus:/p" -w /p/tests \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules detection-targets_test.yml
