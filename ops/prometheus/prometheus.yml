# Prometheus scrape config (S0.2 §6.2). Scrapes the four processes'
# /internal/metrics every 10s. The first alert rule (process up==0) is the seed
# of the Roadmap §12 alert catalog.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: scanner-processes
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8000", "ingest:8001", "engine:8002", "worker:8003"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
