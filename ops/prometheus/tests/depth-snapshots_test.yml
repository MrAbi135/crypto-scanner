# promtool unit tests for the depth-snapshot alarm (owner M2 Q3).
#
# Run:  promtool test rules ops/prometheus/tests/depth-snapshots_test.yml
rule_files:
  - ../alerts/depth-snapshots.yml

evaluation_interval: 5m

tests:
  # promtool's clock starts at 0 (1970-01-01T00:00). A stamp of 0 is
  # therefore "now" at the start of the test.
  - interval: 1h
    name: a stamp just under two days old stays quiet, and fires once past two days
    input_series:
      - series: scanner_depth_snapshot_oldest_latest_timestamp_seconds
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 47h
        alertname: DepthSnapshotStale
        exp_alerts: []
      - eval_time: 49h
        alertname: DepthSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A symbol's newest depth snapshot is over two days old"
              description: "The stalest observable symbol's newest daily depth snapshot is 2d 1h 0m 0s old. §6.4 keeps scoring on it (no age limit in the SLS); check the worker's daily universe job."

  - interval: 1h
    name: a stamp refreshed every day never fires
    input_series:
      # The stamp moves forward by a day every 24 samples (one per hour).
      - series: scanner_depth_snapshot_oldest_latest_timestamp_seconds
        values: "0x23 86400x23 172800x23"
    alert_rule_test:
      - eval_time: 71h
        alertname: DepthSnapshotStale
        exp_alerts: []

  - interval: 5m
    name: nothing published fires after two hours, and a published stamp is quiet
    input_series:
      - series: some_other_metric
        values: "1x40"
    alert_rule_test:
      - eval_time: 1h
        alertname: DepthSnapshotFreshnessMissing
        exp_alerts: []
      - eval_time: 3h
        alertname: DepthSnapshotFreshnessMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No depth-snapshot freshness published"
              description: "The worker publishes the depth-snapshot freshness at boot and after each daily run; none has been seen for two hours."
