name: scanner-dev

# One file runs the entire dev platform (S0.2 §6). PostgreSQL + TimescaleDB are
# one container by design (TDR §8). Observability is opt-in via `--profile obs`.
#
# `pnpm dev` on the host is still the way to work on the frontend. The
# `frontend` + `caddy` pair below is for the soak box, where there is no host
# to run it on and S13a's whole point -- the developer looking at the doctrine
# on a chart -- has otherwise been unreachable. Both are in the `ui` profile so
# an ordinary `up` does not start them.

services:
  db:
    image: timescale/timescaledb:2.15.2-pg16
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner-dev-only # dev-only literal; real envs use SOPS
      POSTGRES_DB: scanner
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    command: ["python", "-m", "scanner.runtime.api"]
    env_file: [../env/dev.env]
    environment:
      SCANNER_API_PORT: "8000"
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/internal/health/ready', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  ingest:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    command: ["python", "-m", "scanner.runtime.ingest"]
    env_file: [../env/dev.env]
    environment:
      SCANNER_HEALTH_PORT: "8001"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/internal/health/ready', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Speed step 1 (owner, 2026-10-27; deploy-baseline/SPEED_PLAN_G2_C4.md): two
  # engine processes share the symbols by SHA-256 hash (#320,
  # application/detection/shards.py). On the 2-OCPU VM one engine used ~0.85
  # of a core through a close burst while the second core idled. The split of
  # today's 15 symbols is 6/9, so a burst should finish ~1.67x sooner.
  #
  # The shard count lives HERE, not in ops/env/dev.env, so that every
  # `compose up` of this file produces the same topology. A count of 2 on one
  # service and 1 on another would put two processes on the same symbols.
  # Going back to one engine is ops/soak/shards_off.sh, never an edit here: the
  # single `engine` group must first be moved to where the shards stopped.
  engine:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    image: scanner-dev-engine
    command: ["python", "-m", "scanner.runtime.engine"]
    env_file: [../env/dev.env]
    environment:
      SCANNER_HEALTH_PORT: "8002"
      SCANNER_ENGINE_SHARD_COUNT: "2"
      SCANNER_ENGINE_SHARD_INDEX: "0"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/internal/health/ready', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Shard 1 of 2: the same image as `engine` (built once, by that service), so
  # the two can never run different code.
  engine-shard1:
    image: scanner-dev-engine
    pull_policy: never
    command: ["python", "-m", "scanner.runtime.engine"]
    env_file: [../env/dev.env]
    environment:
      SCANNER_HEALTH_PORT: "8002"
      SCANNER_ENGINE_SHARD_COUNT: "2"
      SCANNER_ENGINE_SHARD_INDEX: "1"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      engine: {condition: service_started}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/internal/health/ready', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    command: ["python", "-m", "scanner.runtime.worker"]
    env_file: [../env/dev.env]
    environment:
      SCANNER_HEALTH_PORT: "8003"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/internal/health/ready', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --- observability (opt-in: `docker compose --profile obs up`) ---
  # S13a's screen, for hosts with no developer machine attached.
  frontend:
    profiles: ["ui"]
    build:
      context: ../..
      dockerfile: ops/docker/frontend.Dockerfile
    restart: unless-stopped

  caddy:
    profiles: ["ui"]
    image: caddy:2-alpine
    # **Loopback only.** The host firewall allows 22 and rejects the rest, so
    # binding 0.0.0.0 would publish a port nothing can reach while looking as
    # though it had opened one. Reached with `ssh -L 8080:127.0.0.1:8080`; see
    # ops/caddy/Caddyfile.dev for why a tunnel is the right answer here and not
    # merely the available one.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped
    depends_on: [api, frontend]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ../prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.1.1
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki]

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
