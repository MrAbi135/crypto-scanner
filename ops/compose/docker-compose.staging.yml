name: scanner-staging

# Staging topology (S0.2 §6.1): dev services minus host-published data ports,
# plus the Caddy edge, the frontend static image, and the always-on
# observability stack. Env arrives from the SOPS-decrypted file the deploy
# pipeline writes (../env/staging.env); it is `required: false` so the compose
# file validates without secrets present.

x-backend: &backend
  build:
    context: ../..
    dockerfile: ops/docker/backend.Dockerfile
  env_file:
    - path: ../env/staging.env
      required: false
  read_only: true
  tmpfs: ["/tmp"]
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: timescale/timescaledb:2.15.2-pg16
    env_file:
      - path: ../env/staging.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["python", "-m", "scanner.runtime.api"]
    environment:
      SCANNER_API_PORT: "8000"

  ingest:
    <<: *backend
    command: ["python", "-m", "scanner.runtime.ingest"]
    environment:
      SCANNER_HEALTH_PORT: "8001"

  engine:
    <<: *backend
    command: ["python", "-m", "scanner.runtime.engine"]
    environment:
      SCANNER_HEALTH_PORT: "8002"

  worker:
    <<: *backend
    command: ["python", "-m", "scanner.runtime.worker"]
    environment:
      SCANNER_HEALTH_PORT: "8003"

  frontend:
    build:
      context: ../..
      dockerfile: ops/docker/frontend.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      SCANNER_PUBLIC_HOST: ${SCANNER_PUBLIC_HOST:-staging.scanner.example}
    restart: unless-stopped
    depends_on: [api, frontend]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped
    depends_on: [prometheus, loki]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  promdata:
  lokidata:
  grafanadata:
