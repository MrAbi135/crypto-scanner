# Promtail: scrape Docker container logs -> Loki (S0.2 §6.2).
# structlog JSON lines land queryable in Grafana. Labels kept to {service,level}
# (+ env from the environment) to bound cardinality.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: env
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
