[project]
name = "scanner"
version = "0.1.0"
description = "Institutional AI Crypto Scanner — backend"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "prometheus-client>=0.20",
  # --- Sprint S1 additions (justification per S0.1 §23) ---
  "httpx>=0.27",          # Binance REST adapter transport (TDR-approved client)
  "sqlalchemy>=2.0.30",   # repositories (TDR §26)
  "asyncpg>=0.29",        # async PG driver + COPY hot path (TDR §26)
  "alembic>=1.13",        # migrations (TDR §26)
  # --- Sprint S0.2 additions ---
  "redis>=5.0",           # readiness-probe Redis PING (TDR §9); stream/cache use lands S2
  # --- Sprint S0.3 additions ---
  "sentry-sdk>=2.0",      # exception reporting (TDR §20); DSN-gated, disabled by default
  "websockets>=17.0.1",
]

[dependency-groups]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "testcontainers[postgres]>=4.4",  # S1: integration tests vs real PG (Roadmap §8)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "T20", "SIM", "RUF"]
ignore = ["S101", "UP042"]   # UP042: (str, Enum) is intentional — StrEnum changes str() semantics

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/scanner/interfaces/cli/**" = ["T20"]  # the CLI's job is printing
"src/scanner/runtime/cli.py" = ["T20"]     # the CLI composition root renders reports
"tests/golden/test_golden.py" = ["T20"]    # the SLS coverage report is the deliverable

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["scanner"]
plugins = ["pydantic.mypy"]   # S0.2: pydantic-settings construct-from-env typechecks under --strict

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q --cov=scanner --cov-report=term-missing"
asyncio_mode = "auto"
markers = ["integration: requires real services", "property: hypothesis suites"]

[tool.coverage.run]
# Excluded from the UNIT coverage floor because they require live services or
# are non-logic composition/entrypoints (all exercised by the integration suite
# tests/integration/ or by running the process): the asyncpg COPY repository +
# engine factory, Alembic migration env, the four process entrypoints + the CLI
# composition root, and the backward-compat settings shim. Rationale: ADR-002.
#
# ENTRY RULE: a file may only be listed here once real coverage for it exists
# elsewhere. Omitting a file to make the number go green is forbidden — the
# omission must move the proof, not delete it. Each entry below names the suite
# that covers it.
omit = [
  "*/runtime/api.py",
  "*/runtime/ingest.py",
  "*/runtime/engine.py",
  "*/runtime/worker.py",
  "*/runtime/cli.py",
  "*/infrastructure/persistence/repositories.py",
  "*/infrastructure/persistence/database.py",
  "*/infrastructure/persistence/alembic/*",
  "*/config/settings.py",
  # S4/S5/S6 detection repositories. These push doctrine invariants into SQL
  # (ON CONFLICT ... WHERE state-resurrection guards, optimistic transitions,
  # ON CONFLICT DO NOTHING idempotency, numeric(38,18) exactness, total
  # orderings), none of which a unit fake can assert. Covered by
  # tests/integration/test_detection_persistence_pg.py against real
  # TimescaleDB. Added 2026-08-16 with that suite, not before it.
  "*/infrastructure/persistence/detection_repositories.py",
  "*/infrastructure/persistence/ict_zone_repositories.py",
  "*/infrastructure/persistence/ict_zone_interaction_repository.py",
  "*/infrastructure/persistence/ict_evidence_repository.py",
  "*/infrastructure/persistence/liquidity_detection_repositories.py",
]

[tool.coverage.report]
fail_under = 85

[tool.importlinter]
root_package = "scanner"
# Required so the "Domain purity" forbidden-contract can resolve external
# modules (pydantic, sqlalchemy, …). Tooling config only — contract semantics
# unchanged.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (TAD §27)"
type = "layers"
layers = ["scanner.runtime", "scanner.interfaces | scanner.infrastructure", "scanner.application", "scanner.domain", "scanner.shared"]

[[tool.importlinter.contracts]]
name = "Domain purity (TAD §2.3)"
type = "forbidden"
source_modules = ["scanner.domain"]
forbidden_modules = ["pydantic", "sqlalchemy", "redis", "fastapi", "structlog", "httpx", "asyncpg", "alembic"]

[[tool.importlinter.contracts]]
name = "Engine acyclicity (TAD §27)"
type = "layers"
containers = ["scanner.domain"]
layers = ["lifecycle", "ranking", "confluence", "liquidity | ict | volume | momentum", "structure", "common"]
